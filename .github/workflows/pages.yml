name: Publicar web

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'    # refresca la copia de datos de Renfe (GitHub puede retrasar estas ejecuciones)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Construir index.html
        run: |
          mkdir -p _site/data
          node scripts/build.mjs _site/index.html

      - name: Copia de los datos en tiempo real de Renfe
        continue-on-error: true
        run: |
          for f in flotaLD.json trenesConEstacionesLD.json; do
            if curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 --max-time 40 \
                 -A "Mozilla/5.0 (TrainViewer; +https://github.com/Paticuaker/TrainViewer)" \
                 -o "_site/data/$f" "https://tiempo-real.largorecorrido.renfe.com/renfe-visor/$f"; then
              echo "Descargado $f ($(wc -c < "_site/data/$f") bytes)"
            else
              echo "::warning::No se pudo descargar $f"
              rm -f "_site/data/$f"
            fi
          done

      - name: Resumen de los datos descargados
        continue-on-error: true
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["flotaLD.json", "trenesConEstacionesLD.json"]) {
              const p = "_site/data/" + f;
              if (!fs.existsSync(p)) { console.log(f + ": no disponible"); continue; }
              const d = JSON.parse(fs.readFileSync(p, "utf8"));
              const list = Array.isArray(d) ? d : (d.trenes || []);
              console.log(f + ": claves=" + Object.keys(d).join(",") + " trenes=" + list.length);
              console.log("  ejemplo: " + JSON.stringify(list[0]).slice(0, 700));
            }'

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

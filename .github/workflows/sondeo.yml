name: Sondeo de fuentes (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Adif renderizado
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > ./p.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch(); const p = await b.newPage();
          const xhr = [];
          p.on('response', r => { const u = r.url(); const ct = r.headers()['content-type'] || ''; if (/json|xml/.test(ct) || /api|o\/|estado|incid/i.test(u)) xhr.push(r.status() + ' ' + ct.slice(0, 30) + ' ' + u.slice(0, 200)); });
          await p.goto('https://www.adif.es/viajeros/estado-de-la-red', { waitUntil: 'networkidle', timeout: 60000 }); await p.waitForTimeout(3000);
          console.log('==== ESTADO DOM');
          console.log(await p.evaluate(() => { const h = [...document.querySelectorAll('*')].find(e => e.children.length === 0 && /Incidencia en la línea/.test(e.textContent)); let c = h; for (let i = 0; i < 4 && c; i++) c = c.parentElement; return c ? c.outerHTML.replace(/\s+/g, ' ').slice(0, 5000) : 'no'; }));
          await p.goto('https://www.adif.es/viajeros/avisos', { waitUntil: 'networkidle', timeout: 60000 }); await p.waitForTimeout(3000);
          console.log('==== AVISOS DOM');
          console.log(await p.evaluate(() => { const h = [...document.querySelectorAll('*')].find(e => e.children.length === 0 && /Obras Redondela/.test(e.textContent)); let c = h; for (let i = 0; i < 5 && c; i++) c = c.parentElement; return c ? c.outerHTML.replace(/\s+/g, ' ').slice(0, 3000) : 'no'; }));
          const link = await p.evaluate(() => { const a = [...document.querySelectorAll('a')].find(a => /Leer aviso: Obras Redondela/.test(a.textContent) || /Redondela/.test(a.getAttribute('aria-label') || '')); return a ? a.href : null; });
          console.log('==== DETALLE', link);
          if (link) { await p.goto(link, { waitUntil: 'networkidle', timeout: 60000 }); console.log(await p.evaluate(() => (document.querySelector('main') || document.body).innerText.replace(/\n\s*\n+/g, '\n').slice(0, 2500))); }
          await b.close();
          JS
          node ./p.mjs

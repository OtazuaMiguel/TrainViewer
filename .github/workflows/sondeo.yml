name: Sondeo de fuentes (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Adif renderizado
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > ./p.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch(); const p = await b.newPage();
          const xhr = [];
          p.on('response', r => { const u = r.url(); const ct = r.headers()['content-type'] || ''; if (/json|xml/.test(ct) || /api|o\/|estado|incid/i.test(u)) xhr.push(r.status() + ' ' + ct.slice(0, 30) + ' ' + u.slice(0, 200)); });
          for (const u of ['https://www.adif.es/viajeros/estado-de-la-red', 'https://www.adif.es/viajeros/avisos']) {
            xhr.length = 0;
            await p.goto(u, { waitUntil: 'networkidle', timeout: 60000 }); await p.waitForTimeout(4000);
            console.log('=================', u);
            const t = await p.evaluate(() => { const m = document.querySelector('main, #main-content, .portlet-layout') || document.body; return m.innerText; });
            const i = t.indexOf('Estado de la red'); console.log(t.replace(/\n\s*\n+/g, '\n').slice(0, 7000));
            console.log('--- peticiones:'); for (const x of xhr.filter(x => !/\.(js|css|png|svg|woff)/.test(x))) console.log('  ', x);
            const cards = await p.evaluate(() => [...document.querySelectorAll('[class*="aviso-card"], [class*="aviso-estado-red__"]')].slice(0, 5).map(e => e.className + ' :: ' + e.outerHTML.slice(0, 400)));
            console.log('--- estructura:'); cards.forEach(c => console.log('  ', c.replace(/\s+/g, ' ')));
          }
          await b.close();
          JS
          node ./p.mjs

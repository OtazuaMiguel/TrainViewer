name: Sondeo de fuentes (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Páginas de Adif
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for u in "https://www.adif.es/viajeros/estado-de-la-red" "https://www.adif.es/viajeros/avisos"; do
            echo "=================== $u"
            curl -sSL -m 30 -A "$UA" -o /tmp/r "$u"
            python3 - <<'PY'
          import re,html
          b=open('/tmp/r','rb').read().decode('utf8','replace')
          # bloques con incidencias: busca palabras clave y muestra HTML alrededor (clases y estructura)
          for m in list(re.finditer(r'(?i)(interrumpid|restablec|incidencia|afecta|cortad|suspendid|limitaci)', b))[:12]:
              s=max(0,m.start()-500); print('--- HTML @',m.start()); print(re.sub(r'\s+',' ',b[s:m.start()+600])); print()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',b,flags=re.S|re.I)
          t=html.unescape(re.sub(r'<[^>]+>','\n',t)); t=re.sub(r'[ \t]+',' ',t); t=re.sub(r'\n\s*\n+','\n',t)
          i=t.find('Periodos hast'); i = i if i>0 else 0
          print('=== TEXTO (tras el menú)'); print(t[i:i+6000])
          PY
          done

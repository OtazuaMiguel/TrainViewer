name: Sondeo de fuentes (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Horarios GTFS de Renfe
        run: |
          set +e
          for u in "https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip" "https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip"; do
            echo "=================== $u"
            curl -sSL -m 120 -A "Mozilla/5.0" -o /tmp/g.zip -w 'HTTP %{http_code} %{size_download} bytes\n' "$u"
            rm -rf /tmp/g && mkdir /tmp/g && unzip -q -o /tmp/g.zip -d /tmp/g && ls -la /tmp/g
            for f in agency routes trips stops calendar calendar_dates stop_times; do [ -f /tmp/g/$f.txt ] && { echo "--- $f.txt ($(wc -l < /tmp/g/$f.txt) líneas)"; head -4 /tmp/g/$f.txt; }; done
          done
          curl -sSL -m 120 -A "Mozilla/5.0" -o /tmp/g.zip "https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip"; rm -rf /tmp/g && mkdir /tmp/g && unzip -q -o /tmp/g.zip -d /tmp/g
          curl -sS -m 40 -o /tmp/flota.json https://tiempo-real.largorecorrido.renfe.com/renfe-visor/flotaLD.json
          python3 - <<'PY'
          import csv, json, collections, datetime
          d='/tmp/g/'
          routes={r['route_id']:r for r in csv.DictReader(open(d+'routes.txt',encoding='utf-8-sig'))}
          trips=list(csv.DictReader(open(d+'trips.txt',encoding='utf-8-sig')))
          print('rutas', len(routes), 'viajes', len(trips))
          print('route_short_name:', collections.Counter(r.get('route_short_name','') for r in routes.values()).most_common(25))
          print('route_type:', collections.Counter(r.get('route_type','') for r in routes.values()))
          print('trip ejemplo', trips[0])
          short=collections.Counter(bool(t.get('trip_short_name')) for t in trips); print('con trip_short_name', short)
          fl=json.load(open('/tmp/flota.json'))['trenes']; nums=set(str(t['codComercial']).lstrip('0') for t in fl)
          ts=set((t.get('trip_short_name') or t['trip_id']).lstrip('0') for t in trips)
          ids=set(t['trip_id'][:6].lstrip('0') for t in trips)
          print('flota', len(nums), 'coinciden con trip_short_name', len(nums & ts), 'con prefijo trip_id', len(nums & ids))
          print('ejemplos flota sin coincidencia', list(nums - ts - ids)[:15])
          cal=list(csv.DictReader(open(d+'calendar.txt',encoding='utf-8-sig'))) if __import__('os').path.exists(d+'calendar.txt') else []
          print('calendar filas', len(cal), cal[:2])
          import os
          if os.path.exists(d+'calendar_dates.txt'):
              cd=list(csv.DictReader(open(d+'calendar_dates.txt',encoding='utf-8-sig'))); print('calendar_dates', len(cd), cd[:3])
          st=sum(1 for _ in open(d+'stop_times.txt',encoding='utf-8-sig')); print('stop_times', st)
          stops=list(csv.DictReader(open(d+'stops.txt',encoding='utf-8-sig'))); print('stops', len(stops), stops[:3])
          print([s for s in stops if 'tocha' in s['stop_name']][:5])
          PY

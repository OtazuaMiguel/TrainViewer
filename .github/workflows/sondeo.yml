name: Sondeo de fuentes (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Avisos de Adif
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sSL -m 30 -A "$UA" -o /tmp/avisos.html "https://www.adif.es/viajeros/avisos"
          curl -sSL -m 30 -A "$UA" -o /tmp/estado.html "https://www.adif.es/viajeros/estado-de-la-red"
          python3 - <<'PY'
          import re,html
          def txt(s): return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',s))).strip()
          b=open('/tmp/avisos.html',encoding='utf8',errors='replace').read()
          cards=re.split(r'<div class="aviso-card(?=[ "])', b)[1:]
          print('TARJETAS', len(cards))
          for c in cards:
              st=re.search(r'status--(\w+)',c); t=re.search(r'<strong>(.*?)</strong>',c,re.S)
              links=re.findall(r'href="([^"]+)"',c)[:3]
              body=txt(c)[:420]
              print('*', st.group(1) if st else '?', '|', txt(t.group(1)) if t else '?', '|', body, '|', links)
          e=open('/tmp/estado.html',encoding='utf8',errors='replace').read()
          print('\nESTADO: urls interesantes')
          for u in sorted(set(re.findall(r'["\'](https?://[^"\']*?(?:api|json|incid|estado|circul)[^"\']*)["\']', e, re.I)))[:40]: print(' ', u)
          for u in sorted(set(re.findall(r'["\'](/[^"\']*?(?:api|json|incid|estado-red|circulacion)[^"\']*)["\']', e, re.I)))[:40]: print(' ', u)
          i=e.find('Estado de la red</h1>'); print('\nESTADO h1 en', i)
          for m in re.finditer(r'class="([^"]*(?:incid|estado|linea|tramo|red)[^"]*)"', e, re.I):
              pass
          cls=sorted(set(re.findall(r'class="([^"]*(?:incid|estado|tramo|linea|mapa)[^"]*)"', e, re.I)))
          print('clases:', cls[:40])
          j=e.find('portlet'); print(len(e))
          k=[m.start() for m in re.finditer(r'(?i)iframe|data-url|fetch\(|ajax', e)][:10]
          for p in k: print('---', re.sub(r'\s+',' ',e[max(0,p-200):p+300]))
          PY

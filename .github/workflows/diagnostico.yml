name: Diagnóstico de la web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Proveedores de teselas (sin clave)
        run: |
          n=0
          for u in \
            "https://a.basemaps.cartocdn.com/dark_nolabels/6/31/24.png" \
            "https://a.basemaps.cartocdn.com/rastertiles/dark_nolabels/6/31/24.png" \
            "https://a.basemaps.cartocdn.com/dark_all/6/31/24.png" \
            "https://tile.openstreetmap.org/6/31/24.png" \
            "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/6/24/31" \
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/6/24/31" \
            "https://www.ign.es/wmts/ign-base?layer=IGNBaseTodo&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix=6&TileCol=31&TileRow=24" \
            "https://tms-ign-base.idee.es/1.0.0/IGNBaseTodo/6/31/39.jpeg" \
            "https://www.ign.es/wmts/ign-base?layer=IGNBaseTodo-gris&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix=6&TileCol=31&TileRow=24" \
            "https://www.ign.es/wmts/ign-base?layer=IGNBaseOrto&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix=7&TileCol=62&TileRow=48" \
            "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/7/48/62" \
            "https://basemap.nationalmap.gov/arcgis/rest/services/USGSShadedReliefOnly/MapServer/tile/6/24/31" ; do
            n=$((n+1)); out=$(curl -s -o /tmp/t -w '%{http_code} %{content_type} %{size_download}' -m 20 -e "https://paticuaker.github.io/" -A "Mozilla/5.0" "$u")
            body=""; case "$out" in *image*) ;; *) body=" cuerpo=$(head -c 160 /tmp/t | tr '\n' ' ')";; esac
            echo "$out $u$body"; mkdir -p diag/tiles; cp /tmp/t "diag/tiles/$n.img"
          done
      - name: Medir la frescura de los datos (proxy de Supabase)
        continue-on-error: true
        run: |
          node -e '
            const U = "https://dyxrgskqftlxetcgoebp.supabase.co/functions/v1/renfe-proxy?f=flota";
            let prev = null, prevFecha = null;
            (async () => {
              for (let i = 0; i < 30; i++) {
                const t0 = Date.now();
                try {
                  const r = await fetch(U); const j = await r.json();
                  const pos = new Map((j.trenes || []).map(t => [t.codComercial, t.latitud + "," + t.longitud + "," + t.time]));
                  let moved = 0; if (prev) for (const [k, v] of pos) if (prev.get(k) !== v) moved++;
                  const times = (j.trenes || []).map(t => +t.time).filter(Boolean);
                  const newest = Math.max(...times), age = Math.round(Date.now() / 1000 - newest);
                  console.log(`${new Date().toISOString().slice(11, 19)} ${r.status} ${Date.now() - t0}ms cache=${r.headers.get("x-cache")} fecha=${j.fechaActualizacion}${j.fechaActualizacion !== prevFecha ? " (NUEVA)" : ""} trenes=${pos.size} cambiados=${moved} gps_mas_reciente_hace=${age}s cors=${r.headers.get("access-control-allow-origin")}`);
                  prev = pos; prevFecha = j.fechaActualizacion;
                } catch (e) { console.log("error", e.message); }
                await new Promise(r => setTimeout(r, 3000));
              }
            })();'

      - name: Abrir la web en Chromium
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node .github/diag/check.mjs
      - name: Guardar capturas en la rama diagnostico
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan diagnostico
          git rm -rq --cached . ; git add -f diag/
          git commit -qm "Diagnóstico $(date -u +%FT%TZ)"
          git push -f origin diagnostico

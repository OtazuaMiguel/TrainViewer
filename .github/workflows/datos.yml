name: Datos (histórico e incidencias)

# Cada ~15 min: muestra de puntualidad para la gráfica de 7 días e incidencias oficiales de Adif.
# Se publica en la rama «datos» (un único commit que se sustituye, para no engordar el repositorio).
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Navegador para leer Adif
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Datos anteriores
        run: |
          mkdir -p prev
          if git fetch -q --depth=1 origin datos; then
            for f in historico.json incidencias.json horarios.json; do git show "origin/datos:$f" > "prev/$f" 2>/dev/null || rm -f "prev/$f"; done
          else
            echo "Todavía no hay rama datos"
          fi
          ls -la prev

      - name: Horario oficial de Renfe (una vez al día)
        run: |
          mkdir -p out
          HOY=$(TZ=Europe/Madrid date +%F)
          if [ -f prev/horarios.json ] && node -e "process.exit(JSON.parse(require('fs').readFileSync('prev/horarios.json','utf8')).today==='$HOY'?0:1)"; then
            cp prev/horarios.json out/horarios.json; echo "El horario de hoy ya estaba generado"
          elif curl -fsSL --retry 3 --retry-all-errors -m 180 -A "Mozilla/5.0" -o gtfs.zip https://ssl.renfe.com/gtransit/Fichero_AV_LD/google_transit.zip \
               && mkdir -p gtfs && unzip -q -o gtfs.zip -d gtfs && node scripts/horarios.mjs gtfs out/horarios.json; then
            echo "Horario generado"
          else
            echo "::warning::No se pudo generar el horario; se conserva el anterior"
            [ -f prev/horarios.json ] && cp prev/horarios.json out/horarios.json || true
          fi

      - name: Recoger
        run: node scripts/datos.mjs out prev

      - name: Publicar en la rama datos
        run: |
          cd out
          printf '# Datos de TrainViewer\n\nGenerados automáticamente por `.github/workflows/datos.yml`. No editar a mano.\n' > README.md
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Datos $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
